const { useState, useEffect, useRef } = React;

// Hide loading screen once React mounts
function HideLoader() {
  useEffect(() => {
    const el = document.getElementById('loading');
    if (el) { el.classList.add('hidden'); setTimeout(() => el.remove(), 500); }
  }, []);
  return null;
}

function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold });
    if(ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, visible];
}

function FadeSection({ children, delay = 0 }) {
  const [ref, visible] = useInView();
  return (
    <div ref={ref} className={`section-fade${visible ? ' visible' : ''}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

    return () => window.removeEventListener('scroll', h);

/* ── HERO ── */
function Hero() {
  const [typed, setTyped] = useState('');
  const titles = ['QA Tester','IT Support Specialist','WordPress Developer','Salesforce CRM User'];
  const [ti, setTi] = useState(0);
  useEffect(() => {
    let i = 0; let deleting = false;
    const tick = () => {
      const curr = titles[ti % titles.length];
      if (!deleting) {
        setTyped(curr.slice(0, i + 1)); i++;
        if (i === curr.length) { deleting = true; setTimeout(tick, 1400); return; }
      } else {
        setTyped(curr.slice(0, i - 1)); i--;
        if (i === 0) { deleting = false; setTi(t => t + 1); }
      }
      setTimeout(tick, deleting ? 50 : 90);

    return () => clearTimeout(t);
